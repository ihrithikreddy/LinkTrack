# render.yaml — Render Blueprint for LinkTrack
# Deploys: PostgreSQL + Redis + Spring Boot Backend + React Frontend
#
# Usage:
#   1. Push this file to your GitHub repo (already done)
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your GitHub repo → Apply
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: linktrack-db
    databaseName: linktrack
    user: linktrack_user
    plan: free
    region: oregon

services:
  # ──────────────────────────────────────────────────────
  # 1. Redis Cache
  # ──────────────────────────────────────────────────────
  - type: redis
    name: linktrack-redis
    plan: free
    region: oregon
    ipAllowList: []

  # ──────────────────────────────────────────────────────
  # 2. Backend — Spring Boot via Docker
  # ──────────────────────────────────────────────────────
  - type: web
    name: linktrack-backend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080

      # PostgreSQL — individual components (Render connectionString is not JDBC format)
      - key: DB_HOST
        fromDatabase:
          name: linktrack-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: linktrack-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: linktrack-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: linktrack-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: linktrack-db
          property: password

      # Redis — internal Render hostname and port
      - key: REDIS_HOST
        fromService:
          name: linktrack-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: linktrack-redis
          type: redis
          property: port
      - key: REDIS_ENABLED
        value: "true"

      # JWT — Render auto-generates a secure random secret
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

      # App URLs — update these if Render assigns different service names
      - key: BASE_URL
        value: https://linktrack-backend.onrender.com
      - key: FRONTEND_URL
        value: https://linktrack-frontend.onrender.com

  # ──────────────────────────────────────────────────────
  # 3. Frontend — React + Nginx via Docker
  # VITE_API_URL is automatically passed as a Docker build
  # arg by Render (env vars are available during docker build)
  # ──────────────────────────────────────────────────────
  - type: web
    name: linktrack-frontend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://linktrack-backend.onrender.com
