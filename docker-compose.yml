services:
  postgres:
    image: postgres:16-alpine
    container_name: linktrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-linktrack}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-linktrack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linktrack-network

  redis:
    image: redis:7-alpine
    container_name: linktrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - linktrack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linktrack-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-linktrack}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - linktrack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: linktrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - linktrack-network

volumes:
  postgres_data:
  redis_data:

networks:
  linktrack-network:
    driver: bridge
