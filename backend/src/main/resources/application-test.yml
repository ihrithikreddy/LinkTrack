server:
  port: 8081

spring:
  application:
    name: linktrack-test
  datasource:
    url: jdbc:h2:mem:linktracktest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351
    expiration-ms: 3600000
  base-url: http://localhost:8081
  frontend-url: http://localhost:5173
  redis:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
